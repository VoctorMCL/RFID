<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control de Acceso RFID/NFC</title>
<style>
  :root{
    --bg:#0f131a;
    --panel:#171d27;
    --panel-alt:#1e2632;
    --border:#2a3241;
    --border-soft:#242c39;
    --text:#e9edf3;
    --text-muted:#8b93a3;
    --text-dim:#5c6577;
    --accent:#ffb020;
    --accent-soft:rgba(255,176,32,.13);
    --ok:#33d17a;
    --ok-soft:rgba(51,209,122,.13);
    --danger:#ff5a5f;
    --danger-soft:rgba(255,90,95,.13);
    --info:#4fb2ff;
    --info-soft:rgba(79,178,255,.13);
    --font-ui:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-mono:"JetBrains Mono","SF Mono",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);}
  body{min-height:100vh;}
  #app{max-width:1180px;margin:0 auto;padding:20px 20px 60px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:38px;height:38px;border-radius:8px;background:var(--accent-soft);border:1px solid rgba(255,176,32,.35);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark svg{width:20px;height:20px;}
  .brand-text h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px;}
  .brand-text p{font-size:12px;margin:2px 0 0;color:var(--text-muted);}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .clock{font-family:var(--font-mono);font-size:13px;color:var(--text-muted);}
  .conn-pill{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);font-family:var(--font-mono);}
  .conn-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);}
  .conn-dot.err{background:var(--danger);}
  .reset-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);
    font-size:12px;padding:7px 11px;border-radius:7px;cursor:pointer;font-family:var(--font-ui);}
  .reset-btn:hover{color:var(--text);border-color:var(--text-dim);}

  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:4px;margin-bottom:16px;overflow-x:auto;}
  .tab-btn{flex:1;white-space:nowrap;padding:9px 14px;border:none;background:transparent;color:var(--text-muted);
    font-family:var(--font-ui);font-size:13px;font-weight:500;border-radius:7px;cursor:pointer;transition:background .12s,color .12s;}
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{background:var(--panel-alt);color:var(--text);box-shadow:inset 0 0 0 1px var(--border-soft);}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;}
  .panel + .panel{margin-top:14px;}
  h2.section-title{font-size:14px;font-weight:600;margin:0 0 4px;}
  p.section-sub{font-size:12.5px;color:var(--text-muted);margin:0 0 18px;}

  .error-banner{background:var(--danger-soft);border:1px solid rgba(255,90,95,.35);color:var(--danger);
    padding:14px 16px;border-radius:9px;font-size:12.5px;margin-bottom:14px;line-height:1.5;}
  .error-banner code{font-family:var(--font-mono);background:rgba(0,0,0,.25);padding:1px 5px;border-radius:4px;}

  .scanner-layout{display:grid;grid-template-columns:1fr 320px;gap:16px;}
  @media (max-width:820px){.scanner-layout{grid-template-columns:1fr;}}

  .scan-stage{border:1px solid var(--border);border-radius:10px;background:var(--panel-alt);
    padding:28px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;position:relative;overflow:hidden;transition:border-color .2s;}
  .scan-stage.state-ok{border-color:rgba(51,209,122,.5);}
  .scan-stage.state-fail{border-color:rgba(255,90,95,.5);}

  .idle-pulse{width:72px;height:72px;border-radius:50%;border:2px solid var(--accent);display:flex;
    align-items:center;justify-content:center;margin-bottom:16px;animation:pulse 1.8s ease-in-out infinite;}
  .idle-pulse svg{width:30px;height:30px;color:var(--accent);}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,176,32,.35);}70%{box-shadow:0 0 0 16px rgba(255,176,32,0);}100%{box-shadow:0 0 0 0 rgba(255,176,32,0);}}
  .idle-title{font-size:15px;font-weight:600;margin:0 0 4px;}
  .idle-sub{font-size:12.5px;color:var(--text-muted);max-width:340px;line-height:1.5;}

  .result-row{display:flex;align-items:center;gap:20px;width:100%;text-align:left;}
  .avatar{width:84px;height:84px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:700;color:#fff;font-family:var(--font-ui);}
  .avatar.avatar-generic{background:var(--panel);border:2px dashed var(--danger);color:var(--danger);}
  .result-info{flex:1;min-width:0;}
  .result-name{font-size:19px;font-weight:700;margin:0 0 2px;}
  .result-meta{font-size:12.5px;color:var(--text-muted);margin:0 0 10px;}
  .status-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:6px;font-size:12px;
    font-weight:700;letter-spacing:.4px;}
  .status-chip.ok{background:var(--ok-soft);color:var(--ok);}
  .status-chip.fail{background:var(--danger-soft);color:var(--danger);}
  .result-extra{margin-top:12px;font-size:12px;color:var(--text-dim);font-family:var(--font-mono);}

  .scan-controls{display:flex;flex-direction:column;gap:12px;}
  .card-box{border:1px solid var(--border);border-radius:10px;padding:16px;}
  .card-box h3{font-size:12.5px;margin:0 0 10px;color:var(--text-muted);font-weight:600;}
  .field-label{font-size:11.5px;color:var(--text-muted);display:block;margin-bottom:5px;}
  select,input,textarea{width:100%;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);
    font-family:var(--font-ui);font-size:13px;padding:9px 10px;border-radius:7px;outline:none;}
  select:focus,input:focus,textarea:focus{border-color:var(--accent);}
  .btn{border:none;border-radius:7px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:var(--font-ui);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--accent);color:#1a1204;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-ghost:hover{border-color:var(--text-dim);}
  .btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid rgba(255,90,95,.3);}
  .btn-ok{background:var(--ok-soft);color:var(--ok);border:1px solid rgba(51,209,122,.3);}
  .btn-sm{padding:5px 10px;font-size:11.5px;border-radius:6px;}
  .listener-pill{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-muted);}
  .listener-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 1.4s infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}
  .uid-buffer{font-family:var(--font-mono);font-size:12px;color:var(--accent);min-height:16px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);
    font-weight:600;padding:0 10px 10px;border-bottom:1px solid var(--border);}
  tbody td{padding:11px 10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  .mono{font-family:var(--font-mono);font-size:12.5px;color:var(--text-muted);}
  .pill{display:inline-block;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.3px;}
  .pill-ok{background:var(--ok-soft);color:var(--ok);}
  .pill-fail{background:var(--danger-soft);color:var(--danger);}
  .pill-neutral{background:var(--panel-alt);color:var(--text-muted);border:1px solid var(--border);}
  .pill-info{background:var(--info-soft);color:var(--info);}
  .empty-row td{text-align:center;color:var(--text-dim);padding:26px 10px;font-size:13px;}
  .table-scroll{overflow-x:auto;}

  .form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
  @media (max-width:760px){.form-grid{grid-template-columns:1fr 1fr;}}
  .form-row-actions{display:flex;justify-content:flex-end;margin-bottom:18px;}
  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .toolbar select,.toolbar input{width:auto;min-width:160px;}
  .hint{font-size:11.5px;color:var(--text-dim);margin-top:6px;}
  .divider{height:1px;background:var(--border-soft);margin:18px 0;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================ CONEXIÓN A SUPABASE ============================ */
const SUPABASE_URL = 'https://rebvmpptmwltrovsxqjb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlYnZtcHB0bXdsdHJvdnN4cWpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3Mjg1MjgsImV4cCI6MjEwNDMwNDUyOH0.ZZ54_0qYxxgSiF3GcWaNE2jsljRJWHYdvr4GL7YFEyY';

function sbHeaders(extra){
  return Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
  }, extra || {});
}
async function sbGet(table, params){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*${params||''}`, {headers: sbHeaders()});
  if(!res.ok) throw new Error(`GET ${table}: ${res.status} ${await res.text()}`);
  return res.json();
}
async function sbInsert(table, obj){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: sbHeaders({'Prefer':'return=representation'}),
    body: JSON.stringify(obj)
  });
  if(!res.ok) throw new Error(`POST ${table}: ${res.status} ${await res.text()}`);
  const data = await res.json();
  return data[0];
}
async function sbUpdate(table, matchCol, matchVal, patch){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${matchCol}=eq.${encodeURIComponent(matchVal)}`, {
    method: 'PATCH',
    headers: sbHeaders({'Prefer':'return=representation'}),
    body: JSON.stringify(patch)
  });
  if(!res.ok) throw new Error(`PATCH ${table}: ${res.status} ${await res.text()}`);
  return res.json();
}
async function sbDelete(table, matchCol, matchVal){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${matchCol}=eq.${encodeURIComponent(matchVal)}`, {
    method: 'DELETE',
    headers: sbHeaders()
  });
  if(!res.ok) throw new Error(`DELETE ${table}: ${res.status} ${await res.text()}`);
}

/* ============================ ESTADO ============================ */
let state = {
  tab: 'scanner',
  personas: [],
  tarjetas: [],
  torniquetes: [],
  accesos: [],
  currentTorniquete: null,
  lastScan: null,
  historialFiltro: 'todos',
  loaded: false,
  connError: null
};

async function loadState(){
  state.connError = null;
  try{
    const [personas, tarjetas, torniquetes, accesos] = await Promise.all([
      sbGet('personas', '&order=id_persona.asc'),
      sbGet('tarjetas_rfid', '&order=id_tarjeta.asc'),
      sbGet('torniquetes', '&order=id_torniquete.asc'),
      sbGet('accesos', '&order=fecha_hora.desc&limit=300')
    ]);
    state.personas = personas;
    state.tarjetas = tarjetas;
    state.torniquetes = torniquetes;
    state.accesos = accesos;
    if(state.currentTorniquete === null && torniquetes[0]) state.currentTorniquete = torniquetes[0].id_torniquete;
  }catch(e){
    console.error(e);
    state.connError = e.message;
  }
  state.loaded = true;
}

function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('es-CO') + ' ' + d.toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
function initials(nombre, apellido){
  return ((nombre||'?')[0] + (apellido||'')[0]).toUpperCase();
}
function colorFromString(str){
  let hash = 0;
  for(let i=0;i<str.length;i++){ hash = str.charCodeAt(i) + ((hash<<5)-hash); }
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 46%, 42%)`;
}

/* ============================ VALIDACIÓN DE ACCESO ============================ */
async function validarUID(uidRaw){
  const uid = (uidRaw||'').trim();
  if(!uid) return;
  const torniqueteId = state.currentTorniquete;
  const tarjeta = state.tarjetas.find(t => t.uid.toUpperCase() === uid.toUpperCase());
  let resultado, persona = null;

  if(!tarjeta){
    resultado = 'denegado_no_registrado';
  } else {
    persona = state.personas.find(p => p.id_persona === tarjeta.id_persona) || null;
    if(!tarjeta.activa){
      resultado = 'denegado_revocado';
    } else if(persona && persona.fecha_expiracion && new Date(persona.fecha_expiracion) < new Date(new Date().toDateString())){
      resultado = 'denegado_expirado';
    } else {
      resultado = 'permitido';
    }
  }

  try{
    const nuevoAcceso = await sbInsert('accesos', {
      uid_leido: uid,
      id_tarjeta: tarjeta ? tarjeta.id_tarjeta : null,
      id_torniquete: torniqueteId,
      resultado
    });
    state.accesos.unshift(nuevoAcceso);
    state.lastScan = {resultado, persona, tarjeta, acceso: nuevoAcceso};
  }catch(e){
    console.error(e);
    state.lastScan = null;
    alert('No se pudo registrar el acceso en Supabase: ' + e.message);
  }
  render();
}

/* ============================ LECTOR FÍSICO (USB HID) ============================ */
let scanBuffer = '';
let scanTimer = null;
document.addEventListener('keydown', (e) => {
  if(state.tab !== 'scanner') return;
  const tag = document.activeElement.tagName;
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  if(e.key === 'Enter'){
    if(scanBuffer.length > 0){ validarUID(scanBuffer); }
    scanBuffer = '';
    updateBufferDisplay();
    return;
  }
  if(e.key.length === 1){
    scanBuffer += e.key;
    updateBufferDisplay();
    clearTimeout(scanTimer);
    scanTimer = setTimeout(() => { scanBuffer=''; updateBufferDisplay(); }, 700);
  }
});
function updateBufferDisplay(){
  const el = document.getElementById('uid-buffer-display');
  if(el) el.textContent = scanBuffer ? 'Leyendo: ' + scanBuffer : '';
}

/* ============================ RENDER: LAYOUT ============================ */
const TABS = [
  {id:'scanner', label:'Escáner'},
  {id:'personas', label:'Personas'},
  {id:'tarjetas', label:'Tarjetas RFID'},
  {id:'torniquetes', label:'Torniquetes'},
  {id:'historial', label:'Historial'}
];

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderTopbar()}
    ${state.connError ? renderErrorBanner() : ''}
    ${renderTabs()}
    <div id="tab-content">${state.connError ? '' : renderTabContent()}</div>
  `;
  bindGlobalEvents();
  if(!state.connError) bindTabEvents();
}

function renderErrorBanner(){
  return `<div class="error-banner">
    No se pudo conectar con Supabase.<br>
    <code>${esc(state.connError)}</code><br>
    Revisa que la URL y la anon key sean correctas, que el script SQL se haya ejecutado, y que las tablas tengan permisos de lectura para el rol <code>anon</code> (si activaste RLS, necesitas políticas). Dale a "Reintentar" cuando lo corrijas.
  </div>`;
}

function renderTopbar(){
  const now = new Date();
  return `
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffb020" stroke-width="1.8"><path d="M12 2a4 4 0 0 1 4 4v3H8V6a4 4 0 0 1 4-4Z"/><rect x="5" y="9" width="14" height="12" rx="2"/><circle cx="12" cy="15" r="1.6" fill="#ffb020" stroke="none"/></svg>
      </div>
      <div class="brand-text">
        <h1>Control de acceso RFID/NFC</h1>
        <p>Corporación Universitaria Lasallista · Caldas, Antioquia</p>
      </div>
    </div>
    <div class="topbar-right">
      <span class="conn-pill"><span class="conn-dot ${state.connError?'err':''}"></span>${state.connError?'Sin conexión':'Supabase conectado'}</span>
      <span class="clock" id="clock">${now.toLocaleTimeString('es-CO')}</span>
      <button class="reset-btn" id="btn-reset">${state.connError?'Reintentar':'Recargar datos'}</button>
    </div>
  </div>`;
}

function renderTabs(){
  return `<div class="tabs">
    ${TABS.map(t => `<button class="tab-btn ${state.tab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('')}
  </div>`;
}

function renderTabContent(){
  switch(state.tab){
    case 'scanner': return renderScanner();
    case 'personas': return renderPersonas();
    case 'tarjetas': return renderTarjetas();
    case 'torniquetes': return renderTorniquetes();
    case 'historial': return renderHistorial();
    default: return '';
  }
}

/* ============================ TAB: ESCÁNER ============================ */
function renderScanner(){
  const ls = state.lastScan;
  let stageClass = '';
  let stageInner = '';

  if(!ls){
    stageInner = `
      <div class="idle-pulse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2a4 4 0 0 1 4 4v3H8V6a4 4 0 0 1 4-4Z"/><rect x="5" y="9" width="14" height="12" rx="2"/></svg></div>
      <p class="idle-title">Esperando lectura</p>
      <p class="idle-sub">Acerca el carnet al lector RFID/NFC, o usa la simulación manual en el panel de la derecha.</p>
      <div class="uid-buffer" id="uid-buffer-display"></div>
    `;
  } else {
    const ok = ls.resultado === 'permitido';
    stageClass = ok ? 'state-ok' : 'state-fail';
    const p = ls.persona;
    const avatar = p
      ? `<div class="avatar" style="background:${colorFromString(p.documento_identidad)}">${initials(p.nombre,p.apellido)}</div>`
      : `<div class="avatar avatar-generic">?</div>`;
    const nombreCompleto = p ? esc(p.nombre + ' ' + p.apellido) : 'Persona no identificada';
    const meta = p
      ? `${esc(tipoLabel(p.tipo_persona))} · Doc. ${esc(p.documento_identidad)} · ${esc(p.programa||'—')}`
      : 'Esta tarjeta no corresponde a ningún registro activo';
    const motivo = motivoLabel(ls.resultado);
    stageInner = `
      <div class="result-row">
        ${avatar}
        <div class="result-info">
          <p class="result-name">${nombreCompleto}</p>
          <p class="result-meta">${meta}</p>
          <span class="status-chip ${ok?'ok':'fail'}">${ok?'✓ ACCESO PERMITIDO':'✕ ACCESO DENEGADO — '+motivo.toUpperCase()}</span>
          <div class="result-extra">UID ${esc(ls.acceso.uid_leido)} · ${fmtDate(ls.acceso.fecha_hora)} · ${esc(torniqueteName(ls.acceso.id_torniquete))}</div>
        </div>
      </div>
    `;
  }

  const uidOptions = state.tarjetas.map(t => {
    const p = state.personas.find(x=>x.id_persona===t.id_persona);
    return `<option value="${esc(t.uid)}">${esc(t.uid)} — ${p ? esc(p.nombre+' '+p.apellido) : 'sin persona'}</option>`;
  }).join('');

  const torniqueteOptions = state.torniquetes.map(t =>
    `<option value="${t.id_torniquete}" ${t.id_torniquete===state.currentTorniquete?'selected':''}>${esc(t.nombre)} (${esc(t.ubicacion)})</option>`
  ).join('') || `<option value="">Sin torniquetes registrados</option>`;

  return `
  <div class="scanner-layout">
    <div>
      <div class="scan-stage ${stageClass}">${stageInner}</div>
    </div>
    <div class="scan-controls">
      <div class="card-box">
        <h3>Punto de acceso</h3>
        <label class="field-label">Torniquete activo</label>
        <select id="sel-torniquete">${torniqueteOptions}</select>
      </div>
      <div class="card-box">
        <h3>Lector físico</h3>
        <div class="listener-pill"><span class="listener-dot"></span> Escuchando en esta pestaña</div>
        <p class="hint">Compatible con lectores RFID/NFC USB tipo "teclado": conecta el lector y acerca el carnet — el UID se escribe solo y valida al presionar Enter, contra la base de datos real en Supabase.</p>
      </div>
      <div class="card-box">
        <h3>Simular lectura (sin hardware)</h3>
        <label class="field-label">Tarjeta registrada</label>
        <select id="sel-sim-uid">${uidOptions || '<option value="">No hay tarjetas</option>'}</select>
        <div style="height:8px"></div>
        <button class="btn btn-primary" id="btn-sim-scan" style="width:100%">Simular tap de tarjeta</button>
        <div style="height:8px"></div>
        <button class="btn btn-ghost" id="btn-sim-unknown" style="width:100%">Simular tarjeta desconocida</button>
      </div>
    </div>
  </div>`;
}

function tipoLabel(t){ return {estudiante:'Estudiante', docente:'Docente', visitante:'Visitante'}[t] || t; }
function motivoLabel(r){
  return {
    denegado_no_registrado:'tarjeta no registrada',
    denegado_revocado:'tarjeta revocada',
    denegado_expirado:'acceso expirado'
  }[r] || '';
}
function torniqueteName(id){
  const t = state.torniquetes.find(x=>x.id_torniquete===id);
  return t ? t.nombre : '—';
}

/* ============================ TAB: PERSONAS ============================ */
function renderPersonas(){
  const rows = state.personas.map(p => {
    const tarjeta = state.tarjetas.find(t => t.id_persona === p.id_persona);
    return `
    <tr>
      <td><span class="pill pill-neutral">${esc(tipoLabel(p.tipo_persona))}</span></td>
      <td>${esc(p.nombre)} ${esc(p.apellido)}</td>
      <td class="mono">${esc(p.documento_identidad)}</td>
      <td>${esc(p.programa || '—')}</td>
      <td class="mono">${p.fecha_expiracion ? esc(p.fecha_expiracion) : '—'}</td>
      <td>${tarjeta ? `<span class="mono">${esc(tarjeta.uid)}</span>` : `<button class="btn btn-ghost btn-sm" data-assign="${p.id_persona}">Asignar tarjeta</button>`}</td>
      <td><button class="btn btn-danger btn-sm" data-del-persona="${p.id_persona}">Eliminar</button></td>
    </tr>`;
  }).join('');

  return `
  <div class="panel">
    <h2 class="section-title">Registrar persona</h2>
    <p class="section-sub">Estudiantes, docentes y visitantes. Los visitantes pueden llevar fecha límite de acceso.</p>
    <div class="form-grid">
      <div>
        <label class="field-label">Tipo</label>
        <select id="f-tipo">
          <option value="estudiante">Estudiante</option>
          <option value="docente">Docente</option>
          <option value="visitante">Visitante</option>
        </select>
      </div>
      <div><label class="field-label">Nombre</label><input id="f-nombre" placeholder="Ej. Camila"></div>
      <div><label class="field-label">Apellido</label><input id="f-apellido" placeholder="Ej. Restrepo"></div>
      <div><label class="field-label">Documento de identidad</label><input id="f-documento" placeholder="Ej. 1152345678"></div>
      <div><label class="field-label">Programa / área</label><input id="f-programa" placeholder="Ej. Ingeniería de Sistemas"></div>
      <div><label class="field-label">Fecha límite de acceso (solo visitantes)</label><input id="f-expiracion" type="date"></div>
    </div>
    <div class="form-row-actions">
      <button class="btn btn-primary" id="btn-add-persona">Registrar persona</button>
    </div>
    <div class="divider"></div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Tipo</th><th>Nombre</th><th>Documento</th><th>Programa</th><th>Expira</th><th>Tarjeta</th><th></th></tr></thead>
        <tbody>${rows || `<tr class="empty-row"><td colspan="7">Aún no hay personas registradas</td></tr>`}</tbody>
      </table>
    </div>
  </div>`;
}

/* ============================ TAB: TARJETAS ============================ */
function renderTarjetas(){
  const rows = state.tarjetas.map(t => {
    const p = state.personas.find(x=>x.id_persona===t.id_persona);
    return `
    <tr>
      <td class="mono">${esc(t.uid)}</td>
      <td>${p ? esc(p.nombre+' '+p.apellido) : '<span class="mono">sin persona</span>'}</td>
      <td>${p ? esc(tipoLabel(p.tipo_persona)) : '—'}</td>
      <td>${t.activa ? '<span class="pill pill-ok">Activa</span>' : '<span class="pill pill-fail">Revocada</span>'}</td>
      <td>
        ${t.activa
          ? `<button class="btn btn-danger btn-sm" data-toggle-tarjeta="${t.id_tarjeta}" data-activa="0">Revocar</button>`
          : `<button class="btn btn-ok btn-sm" data-toggle-tarjeta="${t.id_tarjeta}" data-activa="1">Reactivar</button>`}
        <button class="btn btn-ghost btn-sm" data-del-tarjeta="${t.id_tarjeta}">Eliminar</button>
      </td>
    </tr>`;
  }).join('');

  const personaOptions = state.personas
    .filter(p => !state.tarjetas.some(t=>t.id_persona===p.id_persona))
    .map(p => `<option value="${p.id_persona}">${esc(p.nombre)} ${esc(p.apellido)}</option>`).join('');

  return `
  <div class="panel">
    <h2 class="section-title">Vincular nueva tarjeta RFID</h2>
    <p class="section-sub">Cada persona sin tarjeta asignada puede vincularse aquí con el UID de su carnet.</p>
    <div class="form-grid">
      <div><label class="field-label">UID de la tarjeta</label><input id="f-uid" placeholder="Ej. 04A1B2C3"></div>
      <div>
        <label class="field-label">Persona</label>
        <select id="f-persona-tarjeta">${personaOptions || '<option value="">No hay personas sin tarjeta</option>'}</select>
      </div>
    </div>
    <div class="form-row-actions">
      <button class="btn btn-primary" id="btn-add-tarjeta">Vincular tarjeta</button>
    </div>
    <div class="divider"></div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>UID</th><th>Persona</th><th>Tipo</th><th>Estado</th><th></th></tr></thead>
        <tbody>${rows || `<tr class="empty-row"><td colspan="5">Aún no hay tarjetas registradas</td></tr>`}</tbody>
      </table>
    </div>
  </div>`;
}

/* ============================ TAB: TORNIQUETES ============================ */
function renderTorniquetes(){
  const rows = state.torniquetes.map(t => `
    <tr>
      <td>${esc(t.nombre)}</td>
      <td>${esc(t.ubicacion)}</td>
      <td><button class="btn btn-ghost btn-sm" data-del-torniquete="${t.id_torniquete}">Eliminar</button></td>
    </tr>`).join('');

  return `
  <div class="panel">
    <h2 class="section-title">Puntos de acceso</h2>
    <p class="section-sub">Los torniquetes registrados aparecen como opción en la pantalla del escáner.</p>
    <div class="form-grid">
      <div><label class="field-label">Nombre</label><input id="f-torn-nombre" placeholder="Ej. Torniquete 3"></div>
      <div><label class="field-label">Ubicación</label><input id="f-torn-ubicacion" placeholder="Ej. Entrada Biblioteca"></div>
    </div>
    <div class="form-row-actions">
      <button class="btn btn-primary" id="btn-add-torniquete">Agregar torniquete</button>
    </div>
    <div class="divider"></div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Nombre</th><th>Ubicación</th><th></th></tr></thead>
        <tbody>${rows || `<tr class="empty-row"><td colspan="3">Aún no hay torniquetes registrados</td></tr>`}</tbody>
      </table>
    </div>
  </div>`;
}

/* ============================ TAB: HISTORIAL ============================ */
function renderHistorial(){
  let lista = state.accesos.slice();
  if(state.historialFiltro !== 'todos'){
    lista = lista.filter(a => a.resultado === state.historialFiltro);
  }
  lista = lista.slice(0, 300);

  const rows = lista.map(a => {
    const t = state.tarjetas.find(x=>x.id_tarjeta===a.id_tarjeta);
    const p = t ? state.personas.find(x=>x.id_persona===t.id_persona) : null;
    const chip = a.resultado === 'permitido'
      ? '<span class="pill pill-ok">Permitido</span>'
      : `<span class="pill pill-fail">${esc(motivoLabel(a.resultado) || 'denegado')}</span>`;
    return `
    <tr>
      <td class="mono">${fmtDate(a.fecha_hora)}</td>
      <td class="mono">${esc(a.uid_leido)}</td>
      <td>${p ? esc(p.nombre+' '+p.apellido) : '<span class="mono">no identificado</span>'}</td>
      <td>${esc(torniqueteName(a.id_torniquete))}</td>
      <td>${chip}</td>
    </tr>`;
  }).join('');

  return `
  <div class="panel">
    <h2 class="section-title">Historial de accesos</h2>
    <p class="section-sub">Registro cronológico real desde Supabase de todos los intentos de ingreso.</p>
    <div class="toolbar">
      <select id="sel-historial-filtro">
        <option value="todos" ${state.historialFiltro==='todos'?'selected':''}>Todos los resultados</option>
        <option value="permitido" ${state.historialFiltro==='permitido'?'selected':''}>Permitidos</option>
        <option value="denegado_no_registrado" ${state.historialFiltro==='denegado_no_registrado'?'selected':''}>No registrados</option>
        <option value="denegado_revocado" ${state.historialFiltro==='denegado_revocado'?'selected':''}>Revocados</option>
        <option value="denegado_expirado" ${state.historialFiltro==='denegado_expirado'?'selected':''}>Expirados</option>
      </select>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Fecha y hora</th><th>UID</th><th>Persona</th><th>Torniquete</th><th>Resultado</th></tr></thead>
        <tbody>${rows || `<tr class="empty-row"><td colspan="5">Todavía no se ha registrado ningún acceso</td></tr>`}</tbody>
      </table>
    </div>
  </div>`;
}

/* ============================ EVENTOS ============================ */
function bindGlobalEvents(){
  document.getElementById('btn-reset').onclick = async () => {
    document.getElementById('btn-reset').textContent = 'Cargando…';
    await loadState();
    render();
  };
  setInterval(() => {
    const el = document.getElementById('clock');
    if(el) el.textContent = new Date().toLocaleTimeString('es-CO');
  }, 1000);
}

function bindTabEvents(){
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => { state.tab = btn.dataset.tab; state.lastScan = null; render(); };
  });

  if(state.tab === 'scanner'){
    const selT = document.getElementById('sel-torniquete');
    if(selT) selT.onchange = (e) => { state.currentTorniquete = Number(e.target.value); };
    const btnSim = document.getElementById('btn-sim-scan');
    if(btnSim) btnSim.onclick = () => {
      const uid = document.getElementById('sel-sim-uid').value;
      if(uid) validarUID(uid);
    };
    const btnUnk = document.getElementById('btn-sim-unknown');
    if(btnUnk) btnUnk.onclick = () => validarUID('FFDEAD' + Math.floor(Math.random()*99).toString().padStart(2,'0'));
    updateBufferDisplay();
  }

  if(state.tab === 'personas'){
    document.getElementById('btn-add-persona').onclick = async () => {
      const nombre = document.getElementById('f-nombre').value.trim();
      const apellido = document.getElementById('f-apellido').value.trim();
      const documento = document.getElementById('f-documento').value.trim();
      if(!nombre || !apellido || !documento){ alert('Nombre, apellido y documento son obligatorios'); return; }
      const btn = document.getElementById('btn-add-persona');
      btn.disabled = true; btn.textContent = 'Guardando…';
      try{
        const nueva = await sbInsert('personas', {
          tipo_persona: document.getElementById('f-tipo').value,
          nombre, apellido,
          documento_identidad: documento,
          programa: document.getElementById('f-programa').value.trim() || null,
          foto_path: `/fotos/${documento}.jpg`,
          fecha_expiracion: document.getElementById('f-expiracion').value || null
        });
        state.personas.push(nueva);
        render();
      }catch(e){ alert('No se pudo guardar en Supabase: ' + e.message); btn.disabled=false; btn.textContent='Registrar persona'; }
    };
    document.querySelectorAll('[data-del-persona]').forEach(b => {
      b.onclick = async () => {
        const id = Number(b.dataset.delPersona);
        if(!confirm('¿Eliminar esta persona? También se eliminará su tarjeta asociada.')) return;
        try{
          const tarjeta = state.tarjetas.find(t=>t.id_persona===id);
          if(tarjeta) await sbDelete('tarjetas_rfid', 'id_tarjeta', tarjeta.id_tarjeta);
          await sbDelete('personas', 'id_persona', id);
          state.personas = state.personas.filter(p=>p.id_persona!==id);
          state.tarjetas = state.tarjetas.filter(t=>t.id_persona!==id);
          render();
        }catch(e){ alert('No se pudo eliminar: ' + e.message); }
      };
    });
    document.querySelectorAll('[data-assign]').forEach(b => {
      b.onclick = async () => {
        const uid = prompt('UID de la tarjeta a vincular:');
        if(!uid) return;
        const id_persona = Number(b.dataset.assign);
        try{
          const nueva = await sbInsert('tarjetas_rfid', {uid: uid.trim(), id_persona, activa:true});
          state.tarjetas.push(nueva);
          render();
        }catch(e){ alert('No se pudo vincular la tarjeta: ' + e.message); }
      };
    });
  }

  if(state.tab === 'tarjetas'){
    const btnAdd = document.getElementById('btn-add-tarjeta');
    if(btnAdd) btnAdd.onclick = async () => {
      const uid = document.getElementById('f-uid').value.trim();
      const id_persona = Number(document.getElementById('f-persona-tarjeta').value);
      if(!uid || !id_persona){ alert('Completa el UID y selecciona una persona'); return; }
      if(state.tarjetas.some(t=>t.uid.toUpperCase()===uid.toUpperCase())){ alert('Ese UID ya está registrado'); return; }
      try{
        const nueva = await sbInsert('tarjetas_rfid', {uid, id_persona, activa:true});
        state.tarjetas.push(nueva);
        render();
      }catch(e){ alert('No se pudo vincular: ' + e.message); }
    };
    document.querySelectorAll('[data-toggle-tarjeta]').forEach(b => {
      b.onclick = async () => {
        const id = Number(b.dataset.toggleTarjeta);
        const nuevaActiva = b.dataset.activa === '1';
        try{
          await sbUpdate('tarjetas_rfid', 'id_tarjeta', id, {activa: nuevaActiva});
          const t = state.tarjetas.find(x=>x.id_tarjeta===id);
          t.activa = nuevaActiva;
          render();
        }catch(e){ alert('No se pudo actualizar: ' + e.message); }
      };
    });
    document.querySelectorAll('[data-del-tarjeta]').forEach(b => {
      b.onclick = async () => {
        const id = Number(b.dataset.delTarjeta);
        if(!confirm('¿Eliminar esta tarjeta?')) return;
        try{
          await sbDelete('tarjetas_rfid', 'id_tarjeta', id);
          state.tarjetas = state.tarjetas.filter(t=>t.id_tarjeta!==id);
          render();
        }catch(e){ alert('No se pudo eliminar: ' + e.message); }
      };
    });
  }

  if(state.tab === 'torniquetes'){
    document.getElementById('btn-add-torniquete').onclick = async () => {
      const nombre = document.getElementById('f-torn-nombre').value.trim();
      const ubicacion = document.getElementById('f-torn-ubicacion').value.trim();
      if(!nombre){ alert('El nombre es obligatorio'); return; }
      try{
        const nuevo = await sbInsert('torniquetes', {nombre, ubicacion});
        state.torniquetes.push(nuevo);
        if(state.currentTorniquete===null) state.currentTorniquete = nuevo.id_torniquete;
        render();
      }catch(e){ alert('No se pudo agregar: ' + e.message); }
    };
    document.querySelectorAll('[data-del-torniquete]').forEach(b => {
      b.onclick = async () => {
        const id = Number(b.dataset.delTorniquete);
        if(!confirm('¿Eliminar este torniquete?')) return;
        try{
          await sbDelete('torniquetes', 'id_torniquete', id);
          state.torniquetes = state.torniquetes.filter(t=>t.id_torniquete!==id);
          if(state.currentTorniquete===id) state.currentTorniquete = state.torniquetes[0] ? state.torniquetes[0].id_torniquete : null;
          render();
        }catch(e){ alert('No se pudo eliminar: ' + e.message); }
      };
    });
  }

  if(state.tab === 'historial'){
    document.getElementById('sel-historial-filtro').onchange = (e) => {
      state.historialFiltro = e.target.value; render();
    };
  }
}

/* ============================ INICIO ============================ */
(async function init(){
  document.getElementById('app').innerHTML = `<div class="panel" style="text-align:center;color:#8b93a3;">Conectando con Supabase…</div>`;
  await loadState();
  render();
})();
</script>
</body>
