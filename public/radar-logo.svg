<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="radarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweep" x1="50%" y1="50%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Blue Filter -->
    <filter id="radarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Target Blip Glow -->
    <filter id="blipGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring Bezel -->
  <circle cx="50" cy="50" r="47" stroke="#1d4ed8" stroke-width="2.2" fill="url(#radarBg)" />
  <circle cx="50" cy="50" r="44" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 3" />

  <!-- Cardinal Compass Markers -->
  <line x1="50" y1="3" x2="50" y2="7" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="50" y1="93" x2="50" y2="97" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="3" y1="50" x2="7" y2="50" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="93" y1="50" x2="97" y2="50" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Concentric Distance Rings -->
  <circle cx="50" cy="50" r="35" stroke="#2563eb" stroke-width="1.2" stroke-opacity="0.55" />
  <circle cx="50" cy="50" r="23" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.65" />
  <circle cx="50" cy="50" r="11" stroke="#60a5fa" stroke-width="1.1" stroke-opacity="0.75" />

  <!-- Crosshairs -->
  <line x1="50" y1="6" x2="50" y2="94" stroke="#1d4ed8" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="3 3" />
  <line x1="6" y1="50" x2="94" y2="50" stroke="#1d4ed8" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="3 3" />

  <!-- Diagonal Sub-Guides -->
  <line x1="19" y1="19" x2="81" y2="81" stroke="#1e3a8a" stroke-width="0.8" stroke-opacity="0.4" />
  <line x1="19" y1="81" x2="81" y2="19" stroke="#1e3a8a" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- Radar Sweep Sector -->
  <path d="M 50 50 L 83 17 A 47 47 0 0 0 50 3 Z" fill="url(#radarSweep)" />
  <line x1="50" y1="50" x2="83" y2="17" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" filter="url(#radarGlow)" />

  <!-- RFID Waves radiating from detected blip -->
  <path d="M 68 26 A 11 11 0 0 1 76 34" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.9" filter="url(#blipGlow)" />
  <path d="M 72 22 A 17 17 0 0 1 82 32" stroke="#0ea5e9" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.6" />

  <!-- Detected Target Blip (RFID) -->
  <circle cx="67" cy="31" r="3.2" fill="#38bdf8" filter="url(#blipGlow)" />
  <circle cx="67" cy="31" r="1.5" fill="#ffffff" />

  <!-- Center Hub Radar -->
  <circle cx="50" cy="50" r="3.5" fill="#2563eb" />
  <circle cx="50" cy="50" r="1.8" fill="#e0f2fe" filter="url(#radarGlow)" />
</svg>
