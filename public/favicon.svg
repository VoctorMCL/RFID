<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="favRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="favWave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Lente circular con contraste optimizado para pestañas del navegador -->
  <circle cx="50" cy="50" r="46" fill="#040816" stroke="url(#favRing)" stroke-width="3" />

  <!-- Ondas RFID de alto contraste -->
  <path d="M 50 36 A 14 14 0 0 1 64 50" stroke="url(#favWave)" stroke-width="5" stroke-linecap="round" />
  <path d="M 50 24 A 26 26 0 0 1 76 50" stroke="url(#favWave)" stroke-width="5.5" stroke-linecap="round" />
  <path d="M 50 12 A 38 38 0 0 1 88 50" stroke="url(#favWave)" stroke-width="6" stroke-linecap="round" />

  <!-- Baliza central y detección -->
  <circle cx="68.4" cy="31.6" r="4.2" fill="#38bdf8" />
  <circle cx="50" cy="50" r="5" fill="#38bdf8" />
  <circle cx="50" cy="50" r="2.2" fill="#ffffff" />
</svg>
